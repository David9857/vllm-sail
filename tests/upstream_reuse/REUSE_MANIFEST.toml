id = "sequence"
path = "tests/test_sequence.py"
mode = "direct"
chips = ["cpu", "810e", "890p"]
category = "params"
reason = "Sequence / IntermediateTensors data-structure logic on CPU tensors; device-independent."
min_tests = 1

