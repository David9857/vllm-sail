# SPDX-License-Identifier: Apache-2.0
# REUSE_MANIFEST.toml -- curated whitelist of upstream vLLM tests reused by
# vllm-sail (CI plan category 5 / Week 5-8).
#
# Every entry points at a test file in the PINNED upstream checkout (resolved
# from .github/vllm-main-verified.commit at CI time, or $VLLM_SOURCE_ROOT
# locally). Paths are relative to the upstream repo root (the directory that
# contains vllm/__init__.py). The whitelist is seeded from
# outputs/02_可复用测试分析.html -- high-confidence L1 (直接可用) entries first,
# plus a few L2 (少量适配) entries whose CPU-runnable core is worth gating.
#
# vllm-sail disguises its PPU platform as CUDA (PPUPlatform._enum =
# PlatformEnum.CUDA, current_platform.is_cuda() is True), so upstream tests
# written against the CUDA platform -- but that do not touch concrete kernel
# numerics -- run unchanged inside the vllm-sail runtime. That is exactly the
# population whitelisted here.
#
# Field reference (see tests/upstream_reuse/_reuse_harness.py:ReuseEntry):
#   id          unique short key (used as the pytest parameter id)
#   path        upstream test file, relative to the upstream repo root
#   mode        "direct"  -> run the file verbatim (test_reuse_direct.py)
#               "adapted" -> run with node selection / env / expected-xfail
#                            applied by test_reuse_adapted.py
#   chips       applicable targets, subset of {"cpu", "810e", "890p"}.
#               "cpu" entries are collected by the PR CPU lane; entries with no
#               "cpu" are marked `ppu` and only run in the nightly device lane.
#   category    free-form grouping (params / config / core / sample / ...)
#   reason      why this entry is direct|adapted (audited on every bump)
#   min_tests   minimum number of upstream test cases that must be collected;
#               guards against a silently-empty run after an upstream refactor
#   # --- optional adaptation knobs (mode = "adapted" only) ---
#   markers     pytest -m expression narrowing the run
#   keywords    pytest -k expression narrowing the run
#   deselect    exact upstream node ids to --deselect
#   env         extra environment variables for the subprocess run
#   xfail       substrings of node names that are KNOWN to fail/skip; any other
#               failure is a real regression
#   skip_reason when set, the entry is skipped entirely with this reason (used
#               to park an entry whose upstream prerequisites are not yet met)

[meta]
schema = 1
upstream_pin_file = ".github/vllm-main-verified.commit"
description = "Whitelist of upstream vLLM tests reused inside the vllm-sail runtime."

# ---------------------------------------------------------------------------
# L1 直接可用 -- pure data-structure / parameter / config logic. No hardware
# SDK, no kernel numerics. Zero edits; run verbatim on CPU and on PPU.
# ---------------------------------------------------------------------------

