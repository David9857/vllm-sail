# ---------------------------------------------------------------------------
# L2 少量适配 -- skeleton reusable, but the file mixes CPU logic with
# device / distributed / network nodes. test_reuse_adapted.py narrows the run
# (markers / -k / deselect / env) and records known xfails. Upstream source is
# NEVER edited; all adaptation lives in the harness + adapted test module.
# ---------------------------------------------------------------------------

[[entry]]
id = "prefix_caching"
path = "tests/v1/core/test_prefix_caching.py"
mode = "adapted"
chips = ["cpu", "810e", "890p"]
category = "core"
reason = "Prefix-cache eviction/hit logic is CPU-runnable, but the module imports KV-transfer connectors, and its two hisparse admission tests go through tests/v1/core/utils.py::create_scheduler(model='facebook/opt-125m'), which resolves the checkpoint on the Hugging Face hub; an offline runner blocks there instead of failing, so deselect connector and hisparse nodes to keep the CPU core green."
keywords = "not connector and not kv_transfer and not hisparse"
min_tests = 1

[[entry]]
id = "tokenizers_registry"
path = "tests/tokenizers_/test_registry.py"
mode = "adapted"
chips = ["cpu"]
category = "tokenization"
reason = "Tokenizer registry consistency needs HuggingFace AutoConfig; pinned to an offline HF_HOME in CI. Parked with a skip_reason until the runner provides a warm tokenizer cache."
env = { HF_HUB_OFFLINE = "1", TRANSFORMERS_OFFLINE = "1" }
skip_reason = "requires a warm offline HF tokenizer cache (HF_HOME) on the runner; enable once the CI cache volume is provisioned"
min_tests = 1

[[entry]]
id = "v1_sample_logprobs"
