minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, commit-msg]
# Match vLLM's local / CI hook stages. Keep tool versions pinned here.
default_stages: [pre-commit, manual]
# Copied patch bodies and generated files must retain their source structure.
# The patch framework, guides and editable upstream manifest remain checked.
exclude: |
  (?x)^(
    csrc/upstream/(?!manifest\.toml$).*|
    vllm_sail/patch/(bugfix|enhancement|performance|template)/.*|
    vllm_sail/patch/manifest\.md|
    vllm_sail/_version\.py
  )$

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.11
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict

  # Same ShellCheck distribution and revision as official vLLM.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--shell=bash, --format=gcc]

  # Local policy guard; assemble prohibited tokens only at runtime.
  - repo: local
    hooks:
      - id: require-sign-off
        name: Require Signed-off-by trailer
        language: system
        entry: >-
          bash -c 'if ! git interpret-trailers --parse "$1" |
          grep -Eiq "^Signed-off-by: [^<>]+ <[^<>[:space:]]+@[^<>[:space:]]+>$"; then
          printf "ERROR: Commit requires a Signed-off-by trailer. Use git commit -s.\n" >&2;
          exit 1; fi' _
        stages: [commit-msg]
        always_run: true
      - id: no-prohibited-tokens
        name: Block prohibited tokens in staged code
        language: system
        entry: >-
          bash -c 'token_a=$(printf "\102\124\126");
          token_b=$(printf "\146\154\171\164\151\147\145\162");
          pattern="${token_a}|${token_b}";
          if git diff --cached --unified=0 --diff-filter=ACMR -- |
          grep -E "^\+([^+]|$)" | grep -m5 -inE "${pattern}"; then
          printf "\nERROR: Found prohibited tokens in staged changes.\n";
          exit 1; fi' _
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
      - id: no-prohibited-tokens-msg
        name: Block prohibited tokens in commit message
        language: system
        entry: >-
          bash -c 'token_a=$(printf "\102\124\126");
          token_b=$(printf "\146\154\171\164\151\147\145\162");
          pattern="${token_a}|${token_b}";
          if grep -iE "${pattern}" "$1"; then
          printf "\nERROR: Found prohibited tokens in commit message.\n";
          exit 1; fi' _
        stages: [commit-msg]
        always_run: true
