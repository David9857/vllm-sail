name: PPU debug
run-name: "PPU debug: ${{ inputs.target }} on build ${{ inputs.build_run_id }}"

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run ID whose ppu-wheels-<run_id> artifact holds the wheels under test
        required: true
        type: string
      target:
        description: Stages to rerun against the existing build
        required: true
        type: choice
        options: [both, pin-ut, model-tests, accuracy-tests]
        default: both
      models:
        description: Comma-separated smoke model catalog keys
        required: false
        default: qwen3.8-27b-m890p
        type: string
      accuracy_models:
        description: Comma-separated accuracy model catalog keys
        required: false
        default: deepseek-v4-mxfp4
        type: string

permissions:
  contents: read
  actions: read
cache-mode: none

jobs:
  pin-unit-tests:
    name: PPU pin UT
    if: inputs.target == 'both' || inputs.target == 'pin-ut'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_ppu-pin-ut.yaml
    with:
      pr_mode: false
      build_run_id: ${{ inputs.build_run_id }}

  model-tests:
    name: PPU model tests
    if: inputs.target == 'both' || inputs.target == 'model-tests'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_ppu-model-tests.yaml
    with:
      pr_mode: false
      build_run_id: ${{ inputs.build_run_id }}
      models: ${{ inputs.models }}

  accuracy-tests:
    name: PPU accuracy tests
    if: inputs.target == 'accuracy-tests'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_ppu-accuracy-tests.yaml
    with:
      pr_mode: false
      build_run_id: ${{ inputs.build_run_id }}
      models: ${{ inputs.accuracy_models }}
