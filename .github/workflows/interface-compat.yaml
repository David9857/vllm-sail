name: Interface compatibility gate

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interface-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu-interface-compat:
    name: Category-1 CPU-only (no upstream source)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-only test tooling
        run: python -m pip install -r requirements/dev.txt
      - name: Run category-1 interface tests (skip upstream_source-marked)
        run: >-
          python -m pytest
          tests/ut/test_upstream_interface_compat.py
          tests/ut/test_patch_idempotency.py
          tests/ut/test_patch_manifest_signature.py
          tests/ut/test_upstream_version_precheck.py
          -q -m "not upstream_source"

  upstream-contract:
    name: Category-1 upstream contract (pinned vLLM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Resolve the pinned upstream ref
        id: upstream
        run: |
          pin="$(tr -d '[:space:]' < .github/vllm-main-verified.commit)"
          [[ "${pin}" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=${pin}" >> "$GITHUB_OUTPUT"
      - name: Check out upstream source without installing vLLM
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: ${{ steps.upstream.outputs.ref }}
          path: .upstream/vllm
          persist-credentials: false
      - name: Record the tested upstream revision
        run: git -C .upstream/vllm rev-parse HEAD
      - name: Install CPU-only test tooling
        run: python -m pip install -r requirements/dev.txt
      - name: Run category-1 upstream_source tests (fail-closed)
        env:
          VLLM_SOURCE_ROOT: ${{ github.workspace }}/.upstream/vllm
        run: >-
          python -m pytest
          tests/ut/test_upstream_interface_compat.py
          tests/ut/test_patch_idempotency.py
          tests/ut/test_patch_manifest_signature.py
          tests/ut/test_upstream_version_precheck.py
          -q -rs -m upstream_source --require-upstream-source

  category2-gate:
    name: Category-2 capability & backend gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-only test tooling
        run: python -m pip install -r requirements/dev.txt
      - name: Run category-2 backend selection tests
        run: >-
          python -m pytest
          tests/ut/test_capability_matrix.py
          tests/ut/test_backend_selection.py
          tests/ut/test_backend_env_override.py
          tests/ut/test_acext_deepgemm_gating.py
          -q
