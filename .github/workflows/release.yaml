name: Release Pypi

# Use the standalone ppu-release-action template repository; uses and template_ref must reference the same version.
# Configure RELEASE_USERNAME, RELEASE_TOKEN, and DATA_TOKEN as repository Actions secrets or organization Actions secrets accessible to the calling repository.
# Save Release wheel artifacts when triggered by a tag.
on:
  # Trigger automatically only on tag pushes, or manually with the specified inputs.
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Name of the package to build and publish'
        required: true
        type: string
        default: vllm_sail
      framework:
        description: 'Name of the required framework, e.g. torch'
        required: true
        type: string
        default: torch
      python_versions:
        description: 'JSON array; available values: 38, 310, 312'
        required: true
        type: string
        default: '["312"]'
      os_versions:
        description: 'JSON array; available values: ubuntu2004, ubuntu2204, ubuntu2404, alios7u2'
        required: true
        type: string
        default: '["ubuntu2404"]'
      runtime_versions:
        description: 'JSON array; available values: 2, 3'
        required: true
        type: string
        default: '["3"]'
      torch_versions:
        description: 'JSON array; available values: 2.8.0, 2.10.0, 2.13.0; [""] omits the Torch version'
        required: true
        type: string
        default: '["2.13.0"]'
      sdk_versions:
        description: 'JSON array; available values: 2.1.0, 2.2.0'
        required: true
        type: string
        default: '["2.2.0"]'
      tag_version:
        description: 'Code version; manually specify a tag when building and publishing multiple wheel packages'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: t-head/ppu-release-action/.github/workflows/matrix-release.yml@master
    permissions:
      contents: write
    secrets:
      template_token: ${{ secrets.TEMPLATE_TOKEN }}
      release_username: ${{ secrets.RELEASE_USERNAME }}
      release_token: ${{ secrets.RELEASE_TOKEN }}
      data_token: ${{ secrets.DATA_TOKEN }}
    with:
      # Manual runs use the provided inputs; tag pushes have no inputs and use the same defaults as manual runs.
      package_name: ${{ inputs.package_name || 'vllm_sail' }}
      framework: ${{ inputs.framework || 'torch' }}
      template_repository: t-head/ppu-release-action
      template_ref: master
      python_versions: ${{ inputs.python_versions || '["312"]' }}
      os_versions: ${{ inputs.os_versions || '["ubuntu2404"]' }}
      runtime_versions: ${{ inputs.runtime_versions || '["3"]' }}
      torch_versions: ${{ inputs.torch_versions || '["2.13.0"]' }}
      sdk_versions: ${{ inputs.sdk_versions || '["2.2.0"]' }}
      tag_version: ${{ inputs.tag_version || ''}}
      build_command: |
        unset PIP_INDEX_URL
        source /usr/local/PPU_SDK/envsetup.sh || true
        which hgcc || true
        python3 -m pip install -r requirements/build.txt
        python3 -m pip install -r requirements/ppu.txt
        PYTORCH_SAIL_ARCH="${PYTORCH_SAIL_ARCH:ppu_15;ppu_10}"
        python3 setup.py bdist_wheel
