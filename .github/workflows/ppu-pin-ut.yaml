name: PPU pin unit tests

on:
  workflow_call:
    inputs:
      pr_mode:
        type: boolean
        default: false
      pr_head_sha:
        type: string
        default: ""
      build_run_id:
        description: PPU CI build run supplying ppu-wheels-<run_id>
        required: true
        type: string
      image:
        description: SAIL runtime image, as used by the E2E smoke
        type: string
        default: reg.docker.alibaba-inc.com/ai-tmp/llm@sha256:24872709b1a84ec0e91260eeeccf6ae7ba52a6c70fb90f55a7aae1c1df503bcb

permissions:
  contents: read
  actions: read
cache-mode: none

jobs:
  pin-unit-tests:
    name: main-verified
    runs-on: k8s-runner-group-cpu-thead
    timeout-minutes: 30
    container:
      image: ${{ inputs.image }}
    env:
      WHEELS_DIR: /tmp/ppu-wheels
      VLLM_USE_RUST_FRONTEND: "0"
      VLLM_USE_RUST_BENCH: "0"
    defaults:
      run:
        shell: bash
    steps:
      - name: Disable internal GitHub mirror rewrite
        shell: bash
        run: |
          # The self-hosted CPU runner image ships a global/system git
          # url.<internal-mirror>.insteadOf = https://github.com rewrite. Left in
          # place it makes actions/checkout fetch from the internal mirror and
          # fail, so strip only the github.com rewrites before checkout.
          for scope in system global; do
            echo "=== ${scope} insteadOf before ==="
            git config --${scope} --get-regexp '^url\..*\.insteadof$' 2>/dev/null || true
            while IFS= read -r section; do
              [ -n "${section}" ] || continue
              git config --${scope} --unset-all "${section}.insteadOf" 2>/dev/null || true
            done < <(git config --${scope} --get-regexp '^url\..*\.insteadof$' 2>/dev/null | awk '$2 ~ /github\.com/ {sub(/\.insteadof$/, "", $1); print $1}')
          done
          echo "=== insteadOf after (system) ==="
          git config --system --get-regexp '^url\..*\.insteadof$' 2>/dev/null || echo none
          echo "=== insteadOf after (global) ==="
          git config --global --get-regexp '^url\..*\.insteadof$' 2>/dev/null || echo none

      - name: Require disabled cache access
        uses: actions/github-script@v7
        with:
          script: |
            if (process.env.ACTIONS_CACHE_MODE !== 'none') {
              core.setFailed('PPU CI requires cache-mode: none');
            }
      - name: Check out vLLM SAIL
        uses: actions/checkout@v4
        with:
          github-server-url: https://github.com
          ref: ${{ inputs.pr_head_sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out revision
        env:
          EXPECTED_SHA: ${{ inputs.pr_head_sha || github.sha }}
        run: test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Download CI-built wheels
        uses: actions/download-artifact@v4
        with:
          name: ppu-wheels-${{ inputs.build_run_id }}
          path: ${{ env.WHEELS_DIR }}
          run-id: ${{ inputs.build_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Verify wheel manifest and pin
        id: manifest
        env:
          REQUIRE_PR_ARTIFACT: ${{ inputs.pr_mode || github.event_name == 'pull_request' }}
          EXPECTED_SHA: ${{ inputs.pr_head_sha || github.sha }}
        run: |
          python scripts/ci/ppu_wheel_manifest.py verify "${WHEELS_DIR}"
          python - <<'PYTHON'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          manifest = json.loads((Path(os.environ["WHEELS_DIR"]) / "wheel-manifest.json").read_text())
          expected = Path(".github/vllm-main-verified.commit").read_text().strip()
          if not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise SystemExit("main-verified must contain an immutable upstream commit SHA")
          actual = manifest["commits"]["vllm"]
          matches = actual == expected
          if os.environ["REQUIRE_PR_ARTIFACT"] == "true":
              # PR gating must fail closed; a manual reuse may skip a different pin.
              subprocess.run(
                  ["python", "scripts/ci/ppu_wheel_manifest.py", "verify", os.environ["WHEELS_DIR"],
                   "--vllm-commit", expected, "--sail-commit", os.environ["EXPECTED_SHA"]],
                  check=True,
              )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"matches={str(matches).lower()}\n")
          summary = f"main-verified: build={actual}, pin={expected}"
          if not matches:
              summary += "; UT skipped because this build does not contain that pin"
              print(f"::notice::{summary}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary + "\n")
          PYTHON

      - name: Run pin UT in a fresh single-card PPU container
        if: steps.manifest.outputs.matches == 'true'
        uses: t-head/ppu-scheduler-action@main
        with:
          image: ${{ inputs.image }}
          nnodes: 0
          nproc_per_node: 1
          namespace: ppu-sched
          node_selector: board-type=OAM-810E
          timeout_minutes: 20
          cleanup_policy: always
          job_suffix: pin-main-verified
          source_dir: /workspace/source
          artifact_paths: ${{ env.WHEELS_DIR }}
          extra_env: WHEELS_DIR=/workspace/source/ppu-wheels,UT_RESULTS_DIR=/mnt/wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/pin-ut-main-verified,VLLM_USE_RUST_FRONTEND=0,VLLM_USE_RUST_BENCH=0
          container_options: |
            privileged: true
            host_ipc: true
            host_network: true
            shm_size: 8Gi
          command: cd /workspace/source && bash scripts/ci/ppu_pin_ut.sh

      - name: Upload pin UT diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-pin-main-verified-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/pin-ut-main-verified/*.log
            /wl_nas/devops/${{ github.run_id }}-${{ github.run_attempt }}/pin-ut-main-verified/pin-ut.xml
            ${{ env.WHEELS_DIR }}/wheel-manifest.json
          if-no-files-found: warn
          retention-days: 14
