name: PPU build and test
run-name: >-
  ${{ github.event_name == 'pull_request' &&
  format('PPU preview PR #{0} @ {1}', github.event.pull_request.number, github.sha) ||
  'PPU build and test' }}

# The formal ready-label and /ci command path dispatches ppu-pr-ci.yaml from the
# default branch and calls this workflow through workflow_call. The ci-preview
# label enables the pull_request route below so a maintainer can also exercise
# workflow definitions from the PR merge commit before merge.
#
# The pull_request definition is PR-controlled. Repository and organization
# fork-run approval plus runner admission policies are the actual trust boundary;
# the ci-preview label is an operational resource gate, not an independent
# sandbox. ready and ready-run-all-tests continue to authorize only the trusted
# default-branch /ci executor.

on:
  workflow_call:
    inputs:
      pr_head_sha:
        description: Exact PR head SHA under test
        type: string
        required: true
      skip_ppu:
        description: Report success without allocating PPU runners for non-impacting changes
        type: boolean
        default: false
      existing_build_run_id:
        description: Skip build and reuse wheels from this run
        type: string
        default: ""
      wheel_source_sha:
        description: Validated SAIL source of the reused or repackaged wheels
        type: string
        default: ""
      native_reuse_run_id:
        description: Trusted donor for vLLM and native SAIL extensions
        type: string
        default: ""
      skip_device_tests:
        description: Build wheels only, without the pin-UT and model-smoke lanes
        type: boolean
        default: false
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths:
      - ".github/workflows/**"
      - "scripts/ci/**"

permissions:
  contents: read
  actions: read
cache-mode: none

concurrency:
  group: >-
    ppu-build-and-test-${{ github.event_name == 'pull_request' &&
    ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
    github.event.label.name == 'ci-preview') &&
    github.event.pull_request.number || github.run_id }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
    ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
    github.event.label.name == 'ci-preview') }}

jobs:
  runtime-image:
    name: Resolve PPU runtime image
    if: >-
      ${{ !inputs.skip_ppu &&
      (github.event_name != 'pull_request' ||
      ((((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'ci-preview')) &&
      !github.event.pull_request.draft &&
      contains(github.event.pull_request.labels.*.name, 'ci-preview'))) }}
    runs-on: 8-ppu-m890p
    timeout-minutes: 10
    env:
      GIT_CONFIG_NOSYSTEM: "1"
    steps:
      - name: Prepare isolated runtime preflight checkout
        id: workspace
        run: |
          config="$(mktemp "${RUNNER_TEMP}/git-config.XXXXXX")"
          source_rel=".ppu-runtime-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          source="${GITHUB_WORKSPACE}/${source_rel}"
          {
            printf 'GIT_CONFIG_GLOBAL=%s\n' "$config"
            printf 'source_rel=%s\n' "$source_rel"
            printf 'source=%s\n' "$source"
          } >> "$GITHUB_OUTPUT"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$config" >> "$GITHUB_ENV"

      - name: Check out vLLM SAIL
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_head_sha || github.sha }}
          path: ${{ steps.workspace.outputs.source_rel }}
          persist-credentials: false

      - name: Resolve the runner-configured CUDA-compatible runtime
        env:
          SOURCE_DIR: ${{ steps.workspace.outputs.source }}
        run: bash "${SOURCE_DIR}/scripts/ci/ppu_runtime_image.sh" >/dev/null

  build:
    needs: runtime-image
    if: >-
      ${{ (github.event_name != 'pull_request' ||
      ((((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'ci-preview')) &&
      !github.event.pull_request.draft &&
      contains(github.event.pull_request.labels.*.name, 'ci-preview'))) &&
      needs.runtime-image.result == 'success' &&
      (inputs.existing_build_run_id || '') == '' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_ppu-build.yaml
    with:
      pr_head_sha: ${{ inputs.pr_head_sha || github.sha }}
      native_reuse_run_id: ${{ inputs.native_reuse_run_id || '' }}

  pin-unit-tests:
    name: PPU pin UT
    needs: [runtime-image, build]
    if: >-
      ${{ !cancelled() &&
      !inputs.skip_device_tests &&
      needs.runtime-image.result == 'success' &&
      (github.event_name != 'pull_request' ||
      ((((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'ci-preview')) &&
      !github.event.pull_request.draft &&
      contains(github.event.pull_request.labels.*.name, 'ci-preview'))) &&
      (needs.build.result == 'success' ||
      (needs.build.result == 'skipped' &&
      (inputs.existing_build_run_id || '') != '' &&
      (inputs.wheel_source_sha || '') != '')) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_ppu-pin-ut.yaml
    with:
      pr_mode: true
      pr_head_sha: ${{ inputs.pr_head_sha || github.sha }}
      build_run_id: ${{ inputs.existing_build_run_id || github.run_id }}
      wheel_source_sha: ${{ inputs.wheel_source_sha || '' }}

  model-tests:
    name: PPU model tests
    needs: [runtime-image, build]
    if: >-
      ${{ !cancelled() &&
      !inputs.skip_device_tests &&
      needs.runtime-image.result == 'success' &&
      (github.event_name != 'pull_request' ||
      ((((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'ci-preview')) &&
      !github.event.pull_request.draft &&
      contains(github.event.pull_request.labels.*.name, 'ci-preview'))) &&
      (needs.build.result == 'success' ||
      (needs.build.result == 'skipped' &&
      (inputs.existing_build_run_id || '') != '' &&
      (inputs.wheel_source_sha || '') != '')) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_ppu-model-tests.yaml
    with:
      pr_mode: true
      pr_head_sha: ${{ inputs.pr_head_sha || github.sha }}
      build_run_id: ${{ inputs.existing_build_run_id || github.run_id }}
      wheel_source_sha: ${{ inputs.wheel_source_sha || '' }}

  gate:
    name: PPU CI gate
    needs: [runtime-image, build, pin-unit-tests, model-tests]
    if: >-
      ${{ always() &&
      (github.event_name != 'pull_request' ||
      ((((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'ci-preview')) &&
      !github.event.pull_request.draft &&
      contains(github.event.pull_request.labels.*.name, 'ci-preview'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every PPU stage to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          SKIP_PPU: ${{ inputs.skip_ppu }}
          SKIP_DEVICE_TESTS: ${{ inputs.skip_device_tests }}
          EXISTING_BUILD_RUN_ID: ${{ inputs.existing_build_run_id || '' }}
          WHEEL_SOURCE_SHA: ${{ inputs.wheel_source_sha || '' }}
        run: |
          python - <<'PYTHON'
          import json
          import os

          results = json.loads(os.environ["JOB_RESULTS"])
          for job, result in results.items():
              print(f"{job}: {result['result']}")
          if os.environ["SKIP_PPU"] == "true":
              unexpected = {
                  job: result["result"]
                  for job, result in results.items()
                  if result["result"] != "skipped"
              }
              if unexpected:
                  raise SystemExit(f"PPU skip unexpectedly ran jobs: {unexpected}")
              print("PPU CI skipped: no PPU-impacting changes")
              raise SystemExit(0)
          runtime_image = results.get("runtime-image", {}).get("result")
          if runtime_image != "success":
              raise SystemExit(f"runtime image preflight did not succeed: {runtime_image}")
          build = results.get("build", {}).get("result")
          reuse = os.environ["EXISTING_BUILD_RUN_ID"] and os.environ["WHEEL_SOURCE_SHA"]
          if build != "success" and not (build == "skipped" and reuse):
              raise SystemExit(f"build did not succeed or use validated wheels: {build}")
          skip_device_tests = os.environ["SKIP_DEVICE_TESTS"] == "true"
          for job in ("pin-unit-tests", "model-tests"):
              result = results.get(job, {}).get("result")
              if skip_device_tests and result == "skipped":
                  continue
              if result != "success":
                  raise SystemExit(f"{job} did not succeed: {result}")
          PYTHON
