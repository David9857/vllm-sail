name: PPU CI

on:
  workflow_call:
    inputs:
      pr_mode:
        type: boolean
        default: false
      pr_head_sha:
        type: string
        default: ""
      existing_build_run_id:
        description: Skip build and reuse wheels from this run
        type: string
        default: ""
      wheel_source_sha:
        description: Validated SAIL source of the reused wheels
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      existing_build_run_id:
        description: Reuse an existing ppu-wheels artifact for pin UT only (blank builds new wheels)
        required: false
        default: ""
        type: string
      build_image:
        description: Digest-pinned SDK image; CI installs the checksum-pinned SAIL Torch
        required: false
        default: reg.docker.alibaba-inc.com/ai-tmp/llm@sha256:24872709b1a84ec0e91260eeeccf6ae7ba52a6c70fb90f55a7aae1c1df503bcb
        type: string
      ops_image:
        description: Digest-pinned operator runtime image matching the build stack
        required: false
        default: reg.docker.alibaba-inc.com/ai-tmp/llm@sha256:24872709b1a84ec0e91260eeeccf6ae7ba52a6c70fb90f55a7aae1c1df503bcb
        type: string
      ops_test_scope:
        description: Initial manual runs always use full; auto remains disabled until qualification
        default: full
        type: choice
        options: [auto, full]
      vllm_ref:
        description: vLLM ref (blank uses .github/vllm-main-verified.commit)
        required: false
        default: ""
        type: string
      pytorch_sail_arch:
        description: Semicolon-separated HG architectures
        required: true
        default: ppu_15;ppu_10
        type: string

permissions:
  contents: read
  actions: read
cache-mode: none

concurrency:
  group: ppu-ci-${{ inputs.pr_mode && 'on-demand' || github.event_name }}-${{ inputs.pr_mode && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.pr_mode }}

jobs:
  build:
    if: inputs.existing_build_run_id == '' && (inputs.pr_mode || github.event_name != 'workflow_dispatch')
    name: PPU wheel build
    runs-on: k8s-runner-group-cpu-thead
    timeout-minutes: 180
    outputs:
      image: ${{ steps.image.outputs.image }}
    container:
      image: ${{ inputs.build_image || 'reg.docker.alibaba-inc.com/ai-tmp/llm@sha256:24872709b1a84ec0e91260eeeccf6ae7ba52a6c70fb90f55a7aae1c1df503bcb' }}
    env:
      VLLM_SAIL_BUILD_IMAGE: ${{ inputs.build_image || 'reg.docker.alibaba-inc.com/ai-tmp/llm@sha256:24872709b1a84ec0e91260eeeccf6ae7ba52a6c70fb90f55a7aae1c1df503bcb' }}
      VLLM_REF: ${{ inputs.vllm_ref }}
      PYTORCH_SAIL_ARCH: ${{ inputs.pytorch_sail_arch || 'ppu_15;ppu_10' }}
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
    steps:
      - name: Disable internal GitHub mirror rewrite
        shell: bash
        run: |
          # The self-hosted CPU runner image ships a global/system git
          # url.<internal-mirror>.insteadOf = https://github.com rewrite. Left in
          # place it makes actions/checkout fetch from the internal mirror and
          # fail, so strip only the github.com rewrites before checkout.
          for scope in system global; do
            echo "=== ${scope} insteadOf before ==="
            git config --${scope} --get-regexp '^url\..*\.insteadof$' 2>/dev/null || true
            while IFS= read -r section; do
              [ -n "${section}" ] || continue
              git config --${scope} --unset-all "${section}.insteadOf" 2>/dev/null || true
            done < <(git config --${scope} --get-regexp '^url\..*\.insteadof$' 2>/dev/null | awk '$2 ~ /github\.com/ {sub(/\.insteadof$/, "", $1); print $1}')
          done
          echo "=== insteadOf after (system) ==="
          git config --system --get-regexp '^url\..*\.insteadof$' 2>/dev/null || echo none
          echo "=== insteadOf after (global) ==="
          git config --global --get-regexp '^url\..*\.insteadof$' 2>/dev/null || echo none

      - name: Require disabled cache access
        uses: actions/github-script@v7
        with:
          script: |
            if (process.env.ACTIONS_CACHE_MODE !== 'none') {
              core.setFailed('PPU CI requires cache-mode: none');
            }
      - name: Check out vLLM SAIL
        uses: actions/checkout@v4
        with:
          github-server-url: https://github.com
          ref: ${{ inputs.pr_head_sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out revision
        env:
          EXPECTED_SHA: ${{ inputs.pr_head_sha || github.sha }}
        run: test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Record build image for downstream tests
        id: image
        run: printf 'image=%s\n' "$VLLM_SAIL_BUILD_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build wheels
        run: bash scripts/ci/build_ppu_wheels.sh

      - name: Upload wheels
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-wheels-${{ github.run_id }}
          path: artifacts/wheels/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-build-diagnostics-${{ github.run_id }}
          overwrite: true
          path: |
            artifacts/logs/**
            artifacts/build-manifest.txt
          if-no-files-found: warn
          retention-days: 14

  # This pipeline remains manual until both board types are qualified.
  detect-ops-changes:
    if: ${{ !inputs.pr_mode && github.event_name == 'workflow_dispatch' && inputs.existing_build_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_image: ${{ steps.detect.outputs.build_image }}
      runtime_image: ${{ steps.detect.outputs.runtime_image }}
      expected_vllm_commit: ${{ steps.detect.outputs.expected_vllm_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Pin manual validation identity and images
        id: detect
        env:
          BUILD_IMAGE_OVERRIDE: ${{ inputs.build_image }}
          OPS_IMAGE_OVERRIDE: ${{ inputs.ops_image }}
          VLLM_REF_OVERRIDE: ${{ inputs.vllm_ref }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.ci.ppu_ops_select import (
              validate_config, validate_environment, resolve_build_image,
              digest_image, sha, github_outputs, collect_changes, write_json,
          )
          root = Path.cwd()
          environment = json.loads(Path('scripts/ci/ppu_ops_environment.json').read_bytes())
          validate_config(json.loads(Path('scripts/ci/ppu_ops_tests.json').read_bytes()), root)
          validate_environment(environment)
          image = resolve_build_image(environment, os.environ['BUILD_IMAGE_OVERRIDE'])
          runtime = digest_image(os.environ['OPS_IMAGE_OVERRIDE'] or environment['runtime_image'])
          expected = sha(os.environ['VLLM_REF_OVERRIDE'] or Path('.github/vllm-main-verified.commit').read_text().strip())
          github_outputs(dict(build_image=image, runtime_image=runtime, expected_vllm_commit=expected))
          write_json('changes.json', collect_changes(root, None, None, os.environ['GITHUB_SHA']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ppu-ops-changes-${{ github.run_id }}-${{ github.run_attempt }}
          path: changes.json
          if-no-files-found: error
          retention-days: 14

  ops-build:
    needs: detect-ops-changes
    runs-on: k8s-runner-group-cpu-thead
    timeout-minutes: 180
    container:
      image: ${{ needs.detect-ops-changes.outputs.build_image }}
    env:
      GIT_CONFIG_NOSYSTEM: "1"
      VLLM_SAIL_BUILD_IMAGE: ${{ needs.detect-ops-changes.outputs.build_image }}
      VLLM_REF: ${{ needs.detect-ops-changes.outputs.expected_vllm_commit }}
      PYTORCH_SAIL_ARCH: ${{ inputs.pytorch_sail_arch }}
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
    steps:
      - name: Prepare isolated job-local Git configuration
        id: git-config
        shell: bash
        run: |
          # Checkout writes safe.directory; retain this config through post-job cleanup.
          config="$(mktemp "${RUNNER_TEMP}/git-config.XXXXXX")"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$config" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Build qualification wheels for this run
        run: bash scripts/ci/build_ppu_wheels.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ppu-wheels-${{ github.run_id }}
          path: artifacts/wheels/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppu-build-diagnostics-${{ github.run_id }}
          overwrite: true
          path: |
            artifacts/logs/**
            artifacts/build-manifest.txt
          if-no-files-found: error
          retention-days: 14

  select-ops-tests:
    needs: [detect-ops-changes, ops-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      matrix: ${{ steps.select.outputs.matrix }}
      has_tests: ${{ steps.select.outputs.has_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ppu-ops-changes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops-selection
      - uses: actions/download-artifact@v4
        with:
          name: ppu-wheels-${{ github.run_id }}
          path: ops-wheels
      - uses: actions/download-artifact@v4
        with:
          name: ppu-build-diagnostics-${{ github.run_id }}
          path: ops-build-diagnostics
      - name: Validate artifacts and generate the full test selection
        id: select
        env:
          BUILD_IMAGE: ${{ needs.detect-ops-changes.outputs.build_image }}
          RUNTIME_IMAGE: ${{ needs.detect-ops-changes.outputs.runtime_image }}
          EXPECTED_VLLM_COMMIT: ${{ needs.detect-ops-changes.outputs.expected_vllm_commit }}
        run: |
          cp scripts/ci/ppu_ops_tests.json scripts/ci/ppu_ops_environment.json ops-selection/
          python scripts/ci/ppu_ops_select.py select --repo . \
            --config ops-selection/ppu_ops_tests.json --environment ops-selection/ppu_ops_environment.json \
            --changes ops-selection/changes.json --build-manifest ops-build-diagnostics/build-manifest.txt \
            --wheel-manifest ops-wheels/wheel-manifest.json --build-run-id "$GITHUB_RUN_ID" \
            --build-image "$BUILD_IMAGE" --runtime-image "$RUNTIME_IMAGE" \
            --expected-vllm-commit "$EXPECTED_VLLM_COMMIT" --scope full --output ops-selection/selection.json
      - uses: actions/upload-artifact@v4
        with:
          name: ppu-ops-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops-selection/
          if-no-files-found: error
          retention-days: 14

  ops-tests:
    needs: [detect-ops-changes, select-ops-tests]
    if: needs.select-ops-tests.outputs.has_tests == 'true'
    uses: ./.github/workflows/_ppu-ops-tests.yaml
    permissions:
      contents: read
      actions: read
    with:
      build_run_id: ${{ github.run_id }}
      matrix: ${{ needs.select-ops-tests.outputs.matrix }}
      selection_artifact: ppu-ops-selection-${{ github.run_id }}-${{ github.run_attempt }}
      build_image: ${{ needs.detect-ops-changes.outputs.build_image }}
      expected_vllm_commit: ${{ needs.detect-ops-changes.outputs.expected_vllm_commit }}
      image: ${{ needs.detect-ops-changes.outputs.runtime_image }}

  pin-unit-tests:
    name: PPU pin UT
    needs: build
    if: >-
      ${{ !cancelled() && (needs.build.result == 'success' ||
      (needs.build.result == 'skipped' && inputs.existing_build_run_id != '' &&
      ((inputs.pr_mode && inputs.wheel_source_sha != '') ||
      (!inputs.pr_mode && github.event_name == 'workflow_dispatch')))) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ppu-pin-ut.yaml
    with:
      pr_mode: ${{ inputs.pr_mode || false }}
      pr_head_sha: ${{ inputs.pr_head_sha }}
      build_run_id: ${{ inputs.existing_build_run_id || github.run_id }}
      wheel_source_sha: ${{ inputs.wheel_source_sha }}
      image: ${{ needs.build.outputs.image || inputs.build_image || 'reg.docker.alibaba-inc.com/ai-tmp/llm@sha256:24872709b1a84ec0e91260eeeccf6ae7ba52a6c70fb90f55a7aae1c1df503bcb' }}

  smoke:
    name: PPU E2E smoke
    needs: build
    if: >-
      ${{ !cancelled() && (needs.build.result == 'success' ||
      (needs.build.result == 'skipped' && inputs.pr_mode &&
      inputs.existing_build_run_id != '' && inputs.wheel_source_sha != '')) &&
      (inputs.pr_mode || github.event_name == 'pull_request') }}
    uses: ./.github/workflows/e2e-ppu.yaml
    with:
      pr_mode: ${{ inputs.pr_mode || false }}
      pr_head_sha: ${{ inputs.pr_head_sha }}
      build_run_id: ${{ inputs.existing_build_run_id || github.run_id }}
      wheel_source_sha: ${{ inputs.wheel_source_sha }}
      image: ${{ needs.build.outputs.image || inputs.build_image || 'reg.docker.alibaba-inc.com/ai-tmp/llm@sha256:24872709b1a84ec0e91260eeeccf6ae7ba52a6c70fb90f55a7aae1c1df503bcb' }}

  gate:
    name: PPU CI gate
    needs: [build, pin-unit-tests, smoke]
    if: ${{ always() && (inputs.pr_mode || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every PPU stage to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          PR_MODE: ${{ inputs.pr_mode || false }}
          EXISTING_BUILD_RUN_ID: ${{ inputs.existing_build_run_id }}
          WHEEL_SOURCE_SHA: ${{ inputs.wheel_source_sha }}
        run: |
          python - <<'PYTHON'
          import json
          import os

          results = json.loads(os.environ["JOB_RESULTS"])
          for job, result in results.items():
              print(f"{job}: {result['result']}")
          build = results.get("build", {}).get("result")
          reuse = (
              os.environ["PR_MODE"] == "true"
              and os.environ["EXISTING_BUILD_RUN_ID"]
              and os.environ["WHEEL_SOURCE_SHA"]
          )
          if build != "success" and not (build == "skipped" and reuse):
              raise SystemExit(f"build did not succeed or use validated wheels: {build}")
          for job in ("pin-unit-tests", "smoke"):
              result = results.get(job, {}).get("result")
              if result != "success":
                  raise SystemExit(f"{job} did not succeed: {result}")
          PYTHON
