# SPDX-License-Identifier: Apache-2.0
#
# PPU kernel corpus manifest.
#
# Single source of truth for which upstream vLLM CUDA translation units the
# plugin ports to HGGC, which tier each one is in, and what needs human
# attention beyond identifier substitution. Consumed by:
#
#   * tools/port_upstream_kernels.py  -- what to fetch and translate
#   * setup.py / CMakeLists.txt       -- what to compile, per tier
#   * vllm_sail/native/stubs.py        -- which ops are unsupported, and why
#   * tests/ut/test_kernel_manifest.py -- integrity
#   * docs/user_guide/supported_features.md -- the supported-kernel table
#
# Design: docs/developer_guide/kernels.md

schema = 1

# The exact upstream vLLM tag the corpus is translated from. Bumping this means
# re-running tools/port_upstream_kernels.py and reviewing the diff.
upstream_ref = "5f63ea461ccd567ece6f50dd3701430c0f321039"

# Compiled tiers, in the order CMake receives them. `x` must never appear here.
# Must stay above [tiers]: a bare key after a table header belongs to that table.
compiled_tiers = ["a"]

[tiers]
a = "Ported now. Minimum viable set for BF16/FP16 inference plus every op the plugin already calls."
b = "Ported next. Non-core quantization, custom collectives, mamba, model-specific fused kernels."
x = "Excluded. No PPU path today; every op defined here gets a runtime stub."

# Hazard classes used by the kernel corpus. A
# hazard is something `sailify` does not and cannot fix.
[hazards]
ptx = "inline asm volatile PTX"
cub = "CUB / Thrust / libcu++ (cuda/std/...)"
cp_async = "cp.async pipeline primitives, __pipeline_*"
mma = "hand-written mma.sync / ldmatrix / wmma"
coop_groups = "cooperative_groups"
tcgen05 = "SM100 tensor memory -- no PPU analogue"
cublas = "direct cuBLAS calls (map to acblas, or exclude)"
driver_vmm = "CUDA driver VMM (cuMemCreate / cuMemMap)"
nccl = "NCCL (maps to pccl)"
cutlass = "CUTLASS / CuTe in the include closure"

# Transformations the port tool applies after sailify. Recorded here so the
# overlay is reviewable as data rather than buried in the tool.
[overlay]
# torch_utils.h includes <cublas_v2.h> and is in the include
# closure of nearly every TU, even those that never call cuBLAS. Left alone,
# sailify rewrites it to <acblas_v2.h> and the whole corpus would drag in
# acblas. The tool drops the include instead.
drop_includes = ["cublas_v2.h", "acblas_v2.h"]
# Upstream's binding TUs def/impl every op including tier-x ones, which would
# not link. The tool prunes them to the compiled tiers and records the removed
# schemas in excluded_ops.toml for vllm_sail/native/stubs.py.
prune_bindings = [
    "csrc/torch_bindings.cpp",
    "csrc/moe/torch_bindings.cpp",
]

# REGISTER_EXTENSION(NAME) (csrc/core/registration.h) defines PyInit_<NAME>, so a
# verbatim copy would export upstream's module init symbol and fail to import as
# vllm_sail._upstream_C. The tool rewrites the name to match our CMake target.
[overlay.rename_extension]
_C_stable_libtorch = "_upstream_C"
_moe_C_stable_libtorch = "_upstream_moe_C"

# HGGC's math library lacks unambiguous half/BF16 isfinite overloads. Reuse the
# float conversion already used by this helper's older-toolkit branch. FP16,
# BF16 and FP32 values retain their finite/Inf/NaN classification in float.
# Each replacement must match exactly once after sailify, or generation fails.
[overlay.replace_text."csrc/moe/grouped_topk_kernels.cu"]
"return hggc::std::isfinite(val);" = "return isfinite(cuda_cast<float, T>(val));"

# PPU 1.0/1.5 do not use programmatic dependent launch. Reuse upstream's
# ordinary launch branch while retaining the same kernel and arguments.
# These exact anchors run after sailify; HG compilation defines __HGGCCC__.
[overlay.replace_text."csrc/fused_minimax_m3_qknorm_rope_kv_insert_kernel.cu"]
"#ifndef USE_ROCM\n  // PDL: enable programmatic stream serialization" = "#if !defined(USE_ROCM) && !defined(__HGGCCC__)\n  // PDL: enable programmatic stream serialization"

[overlay.replace_text."csrc/fused_kimi_k3_mla_key_concat_kv_cache_kernel.cu"]
"#ifndef USE_ROCM\n  static int const sm_version = getSMVersion();" = "#if !defined(USE_ROCM) && !defined(__HGGCCC__)\n  static int const sm_version = getSMVersion();"

[overlay.replace_text."csrc/cache_kernels_fused.cu"]
"  dim3 grid(num_tokens, 1, 1);" = "  if (num_tokens == 0) return;  // Empty graph slot mappings need no launch.\n  dim3 grid(num_tokens, 1, 1);"

# Keep INT8 round-to-nearest-even and saturation without an inline PTX cast.
[overlay.replace_text."csrc/quantization/fused_kernels/quant_conversions.cuh"]
"#else\n  // CUDA path\n  uint32_t dst;" = "#elif defined(__HGGCCC__)\n  float const rounded = nearbyintf(x);\n  if (isnan(rounded)) return 0;\n  return static_cast<int8_t>(fmaxf(-128.0f, fminf(127.0f, rounded)));\n#else\n  // CUDA path\n  uint32_t dst;"

# Empty token batches must not issue a zero-sized device launch.
[overlay.replace_text."csrc/layernorm_quant_kernels.cu"]
"  // For large num_tokens, use smaller blocks to increase SM concurrency." = "  if (num_tokens == 0) return;\n\n  // For large num_tokens, use smaller blocks to increase SM concurrency."
"  dim3 grid(num_tokens);\n  /* This kernel is memory-latency bound" = "  if (num_tokens == 0) return;\n  dim3 grid(num_tokens);\n  /* This kernel is memory-latency bound"

[overlay.replace_text."csrc/quantization/fused_kernels/fused_layernorm_dynamic_per_token_quant.cu"]
"  dim3 grid(num_tokens);\n  dim3 block(std::min(hidden_size, 1024));" = "  if (num_tokens == 0) return;\n  dim3 grid(num_tokens);\n  dim3 block(std::min(hidden_size, 1024));"
"  dim3 grid(num_tokens);\n  const bool batch_invariant_launch" = "  if (num_tokens == 0) return;\n  dim3 grid(num_tokens);\n  const bool batch_invariant_launch"

[overlay.replace_text."csrc/quantization/fused_kernels/fused_silu_mul_block_quant.cu"]
"  dim3 grid(num_tokens, num_groups);" = "  if (num_tokens == 0) return;\n  dim3 grid(num_tokens, num_groups);"

# Reuse upstream's ordinary shared-memory copy implementation on HGGC. A
# warp fence replaces waiting for asynchronous copies: all loads are already
# complete, but the cos/sin tile is subsequently read across warp lanes.
[overlay.replace_text."csrc/async_util.cuh"]
"#if defined(USE_ROCM)\n  *reinterpret_cast<int4*>(smem_ptr)" = "#if defined(USE_ROCM) || defined(__HGGCCC__)\n  *reinterpret_cast<int4*>(smem_ptr)"
"#if defined(USE_ROCM)\n  if (size_bytes == 4)" = "#if defined(USE_ROCM) || defined(__HGGCCC__)\n  if (size_bytes == 4)"
"void cp_async_commit_group() {\n#if defined(COMPATIBLE_ARCH)" = "void cp_async_commit_group() {\n#if !defined(__HGGCCC__) && defined(COMPATIBLE_ARCH)"
"void cp_async_wait_group() {\n#if defined(COMPATIBLE_ARCH)" = "void cp_async_wait_group() {\n#if defined(__HGGCCC__)\n  __syncwarp();\n#elif defined(COMPATIBLE_ARCH)"

[overlay.replace_text."csrc/fused_qknorm_rope_kernel.cu"]
"#endif\n\nnamespace tensorrt_llm::common {" = "#endif\n\n// HGGC requires every named shuffle/barrier lane to participate. Partial\n// rotary dimensions leave only the low rotary_lanes lanes in the RoPE branch.\n#if defined(__HGGCCC__)\n  #define VLLM_SAIL_ROPE_MASK (FINAL_MASK >> (32 - rotary_lanes))\n  #define VLLM_SAIL_ROPE_SYNCWARP() __syncwarp(VLLM_SAIL_ROPE_MASK)\n#else\n  #define VLLM_SAIL_ROPE_MASK FINAL_MASK\n  #define VLLM_SAIL_ROPE_SYNCWARP() __syncwarp()\n#endif\n\nnamespace tensorrt_llm::common {"
"// Before data exchange with in warp, we need to sync.\n        __syncwarp();" = "// Before data exchange with in warp, we need to sync.\n        VLLM_SAIL_ROPE_SYNCWARP();"
"\n          elements2[i] = __shfl_xor_sync(FINAL_MASK, elements[i], pairOffset);" = "\n          elements2[i] = __shfl_xor_sync(VLLM_SAIL_ROPE_MASK, elements[i], pairOffset);"
"// __shfl_xor_sync does not provide memfence. Need to sync again.\n        __syncwarp();" = "// __shfl_xor_sync does not provide memfence. Need to sync again.\n        VLLM_SAIL_ROPE_SYNCWARP();"
"        } else {\n          __syncwarp();\n          int const pairOffset" = "        } else {\n          VLLM_SAIL_ROPE_SYNCWARP();\n          int const pairOffset"
"\n            elements2[i] = __shfl_xor_sync(FINAL_MASK, elements[i], pairOffset);" = "\n            elements2[i] = __shfl_xor_sync(VLLM_SAIL_ROPE_MASK, elements[i], pairOffset);"
"          __syncwarp();\n        }\n      }\n\n      // Store." = "          VLLM_SAIL_ROPE_SYNCWARP();\n        }\n      }\n\n      // Store."
"  // Select token_heads_per_warp: forced value if >0, else auto-select." = "  if (num_tokens == 0) return;\n\n  // Select token_heads_per_warp: forced value if >0, else auto-select."

# Map GDN's PTX copies and group completion to the SAIL SDK pipeline on HGGC.
# wait_all includes committing outstanding copies before waiting for all groups.
# Keep upstream's double buffer, block barriers and CUDA PTX branch unchanged.
[overlay.replace_text."csrc/gdn/fused_gdn_decode_kernel.cu"]
"#include <hggc_runtime.h>" = "#include <hggc_runtime.h>\n#if defined(__HGGCCC__)\n#include <hggc_pipeline_primitives.h>\n#endif"
"  const uint32_t smem_addr =" = "#if defined(__HGGCCC__)\n  __pipeline_memcpy_async(smem_ptr, gmem_ptr, 16);\n#else\n  const uint32_t smem_addr ="
"               : \"r\"(smem_addr), \"l\"(gmem_ptr));" = "               : \"r\"(smem_addr), \"l\"(gmem_ptr));\n#endif"
"  asm volatile(\"cp.async.commit_group;\\n\" ::);" = "#if defined(__HGGCCC__)\n  __pipeline_commit();\n#else\n  asm volatile(\"cp.async.commit_group;\\n\" ::);\n#endif"
"  asm volatile(\"cp.async.wait_all;\\n\" ::: \"memory\");" = "#if defined(__HGGCCC__)\n  __pipeline_commit();\n  __pipeline_wait_prior(0);\n#else\n  asm volatile(\"cp.async.wait_all;\\n\" ::: \"memory\");\n#endif"

